<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livetextning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Anpassad stil för undertext-utseende */
        body {
            background-color: #111; /* Mörk bakgrund för hela sidan */
            color: white;
            font-family: 'Inter', sans-serif; /* Standard webbfont */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Placera texten längst ner */
            min-height: 100vh; /* Fyll hela skärmhöjden */
            overflow: hidden; /* Dölj eventuell scroll */
        }
        #subtitles-container {
            background-color: rgba(0, 0, 0, 0.8); /* Halvtransparent svart bakgrund för texten */
            padding: 1.5rem 2.5rem; /* Mer luft runt texten */
            border-radius: 10px; /* Mjukt rundade hörn */
            text-align: center;
            width: 85%; /* Bredd på textrutan */
            max-width: 1200px; /* Maxbredd för stora skärmar */
            margin-bottom: 5vh; /* Marginal från botten */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Subtil skugga */
            min-height: 10vh; /* Minimumhöjd för att alltid synas lite */
            display: flex; /* Använd flexbox för centrering */
            justify-content: center;
            align-items: center;
        }
        #transcript {
            font-size: 3.5vw; /* Skalbar textstorlek baserad på skärmbredd */
            line-height: 1.4; /* Bra radavstånd */
            font-weight: 500; /* Lite tjockare text */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7); /* Textskugga för läsbarhet */
            margin: 0; /* Ta bort standardmarginal */
        }
        #status {
            position: fixed; /* Fast position */
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        /* Anpassning för mindre skärmar */
        @media (max-width: 768px) {
            #transcript {
                font-size: 5vw; /* Större text på mindre skärmar */
            }
             #subtitles-container {
                width: 95%;
                padding: 1rem 1.5rem;
                margin-bottom: 3vh;
            }
        }
         /* Knappstil (om man vill lägga till en startknapp) */
        .start-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #4CAF50; /* Grön */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease;
        }
        .start-button:hover {
            background-color: #45a049;
        }
         .start-button.active {
             background-color: #f44336; /* Röd när aktiv */
         }
        .start-button.active:hover {
             background-color: #da190b;
         }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="subtitles-container">
        <p id="transcript">Väntar på tal...</p>
    </div>

    <div id="status">Status: Inaktiv</div>

     <button id="startButton" class="start-button">Starta Textning</button>

    <script>
        // Hämta HTML-element
        const transcriptElement = document.getElementById('transcript');
        const statusElement = document.getElementById('status');
        const startButton = document.getElementById('startButton');

        // Kontrollera om Web Speech API stöds
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecognizing = false; // Håller koll på om igenkänning är aktiv

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();

            // --- Konfiguration av taligenkänning ---
            recognition.continuous = true; // Fortsätt lyssna även efter pauser
            recognition.interimResults = true; // Visa resultat medan de bearbetas (ger snabbare feedback)
            recognition.lang = 'sv-SE'; // Sätt språket till svenska

            statusElement.textContent = 'Status: Redo';

            // --- Händelsehanterare ---

            // När ett resultat tas emot
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                // Gå igenom alla resultat
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcriptPart = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        // Om resultatet är slutgiltigt, lägg till det i den permanenta texten
                        finalTranscript += transcriptPart + '. '; // Lägg till punkt och mellanslag
                    } else {
                        // Om resultatet är preliminärt, lägg till det i den temporära texten
                        interimTranscript += transcriptPart;
                    }
                }

                // Uppdatera texten på skärmen
                // Visa den slutgiltiga texten följt av den preliminära
                transcriptElement.textContent = finalTranscript + interimTranscript;

                 // Scrolla ner automatiskt om texten blir för lång (behövs sällan med detta utseende)
                 // transcriptElement.scrollTop = transcriptElement.scrollHeight;
            };

            // När igenkänningen avslutas (kan hända automatiskt)
            recognition.onend = () => {
                if (isRecognizing) {
                    // Starta om automatiskt om vi inte manuellt stoppat
                    recognition.start();
                    statusElement.textContent = 'Status: Startar om...';
                     console.log('Taligenkänning startades om.');
                } else {
                    statusElement.textContent = 'Status: Stoppad';
                     console.log('Taligenkänning stoppad.');
                     transcriptElement.textContent = "Textning stoppad.";
                     startButton.textContent = 'Starta Textning';
                     startButton.classList.remove('active');
                }
            };

            // Vid fel
            recognition.onerror = (event) => {
                console.error('Taligenkänningsfel:', event.error);
                statusElement.textContent = `Fel: ${event.error}`;
                if (event.error === 'no-speech') {
                    statusElement.textContent = 'Fel: Ingen tal uppfattades.';
                } else if (event.error === 'audio-capture') {
                     statusElement.textContent = 'Fel: Mikrofonproblem.';
                     alert("Kunde inte komma åt mikrofonen. Kontrollera att du gett tillåtelse och att mikrofonen fungerar.");
                } else if (event.error === 'not-allowed') {
                    statusElement.textContent = 'Fel: Åtkomst nekad.';
                    alert("Du behöver ge tillåtelse till mikrofonen för att textning ska fungera.");
                }
                 isRecognizing = false; // Stoppa vid fel
                 startButton.textContent = 'Starta Textning';
                 startButton.classList.remove('active');
            };

             // Hantera klick på start/stopp-knappen
            startButton.onclick = () => {
                if (isRecognizing) {
                    // Stoppa igenkänningen
                    recognition.stop();
                    isRecognizing = false;
                    console.log('Försöker stoppa igenkänning...');
                    // Knappen och status uppdateras i onend-eventet
                } else {
                    // Starta igenkänningen
                    try {
                        transcriptElement.textContent = "Startar textning..."; // Tömmer tidigare text
                        recognition.start();
                        isRecognizing = true;
                        statusElement.textContent = 'Status: Lyssnar...';
                        startButton.textContent = 'Stoppa Textning';
                        startButton.classList.add('active');
                        console.log('Taligenkänning startad.');
                    } catch (e) {
                        console.error("Kunde inte starta igenkänning:", e);
                        statusElement.textContent = 'Fel: Kunde inte starta.';
                        alert("Kunde inte starta taligenkänningen. Försök igen.");
                    }
                }
            };

            // --- Starta automatiskt vid laddning (alternativ) ---
            /*
            window.onload = () => {
                 try {
                    recognition.start();
                    isRecognizing = true;
                    statusElement.textContent = 'Status: Lyssnar...';
                    console.log('Taligenkänning startad automatiskt.');
                    // Dölj eller inaktivera startknappen om autostart används
                    // startButton.style.display = 'none';
                 } catch(e) {
                     console.error("Kunde inte autostarta igenkänning:", e);
                     statusElement.textContent = 'Fel: Kunde inte autostarta.';
                     alert("Kunde inte starta taligenkänningen automatiskt.");
                 }
            };
            */

        } else {
            // Om Web Speech API inte stöds
            transcriptElement.textContent = 'Din webbläsare stöder inte taligenkänning.';
            statusElement.textContent = 'Fel: API stöds ej';
            startButton.disabled = true; // Inaktivera knappen
            startButton.style.backgroundColor = '#ccc'; // Gråa ut knappen
            alert('Web Speech API stöds inte av den här webbläsaren. Prova Google Chrome.');
        }
    </script>
</body>
</html>
